###############################################################################
#  Nutanix Objects S3 Credentials 
#
#  These secrets MUST exist before kommander cust install
#  Loki and Velero reference them by name in kommander.yaml.
#
#  Apply:
#    kapply day2/01-objects-secrets.yaml \
#      OBJECTS_ACCESS_KEY="xxx" \
#      OBJECTS_SECRET_KEY="yyy"
#
#  Verify:
#    kubectl get secrets -n kommander | grep -E 'loki|velero'
###############################################################################


apiVersion: v1
kind: Secret
metadata:
  name: dkp-loki
  namespace: kommander
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "${OBJECTS_ACCESS_KEY}"
  AWS_SECRET_ACCESS_KEY: "${OBJECTS_SECRET_KEY}"
  AWS_DEFAULT_REGION: "us-east-1"

---
apiVersion: v1
kind: Secret
metadata:
  name: velero-nutanix-credentials
  namespace: kommander
type: Opaque
stringData:
  aws: |
    [ntnx-object-nkp]
    aws_access_key_id = ${OBJECTS_ACCESS_KEY}
    aws_secret_access_key = ${OBJECTS_SECRET_KEY}
