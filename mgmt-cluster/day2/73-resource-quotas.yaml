# 73-resource-quotas.yaml — Resource Quotas + LimitRanges for tenant namespaces
#
# Apply:
#   kubectl apply -f day2/73-resource-quotas.yaml
#
# Verify:
#   kubectl describe resourcequota -n demo
#   kubectl describe resourcequota -n demo-apps-h6n8q
#   kubectl describe limitrange -n demo
#   kubectl describe limitrange -n demo-apps-h6n8q

# ============================================================================
# DEMO NAMESPACE (workspace — larger quotas)
# ============================================================================

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-quota
  namespace: demo
spec:
  hard:
    requests.cpu: "4"
    limits.cpu: "8"
    requests.memory: 8Gi
    limits.memory: 16Gi
    pods: "50"
    persistentvolumeclaims: "10"
    services.loadbalancers: "2"
    services.nodeports: "5"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: demo-limits
  namespace: demo
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi

# ============================================================================
# DEMO-APPS-H6N8Q NAMESPACE (project — smaller quotas)
# ============================================================================

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-apps-quota
  namespace: demo-apps-h6n8q
spec:
  hard:
    requests.cpu: "2"
    limits.cpu: "4"
    requests.memory: 4Gi
    limits.memory: 8Gi
    pods: "30"
    persistentvolumeclaims: "5"
    services.loadbalancers: "1"
    services.nodeports: "3"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: demo-apps-limits
  namespace: demo-apps-h6n8q
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
