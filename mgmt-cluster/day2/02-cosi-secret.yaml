###############################################################################
#  COSI Driver for Nutanix Provisioner Secret
#
#  Required by cosi-driver-nutanix to provision/manage Nutanix Objects buckets.
#  Used by: Harbor (auto-provisions S3 bucket via COSI)
#
#  Apply bef  Kommander install (or before enabling Harbor):
#    kapply mgmt-cluster/day2/02-cosi-secret.yaml \
#      PC_ENDPOINT="10.12.XX.XX" \
#      PC_PORT="9440" \
#      PC_USER="admin" \
#      PC_PASS="xxx" \
#      OBJECTS_ENDPOINT="https://FS-OBJECT.itcs.local" \
#      OBJECTS_ACCESS_KEY="xxx" \
#      OBJECTS_SECRET_KEY="xxx"
#
#  Verify:
#    kubectl get secret -n kommander cosi-driver-nutanix
#    kubectl get secret -n container-object-storage-system nutanix-object-store-credentials
###############################################################################

apiVersion: v1
kind: Secret
metadata:
  name: cosi-driver-nutanix
  namespace: kommander
type: Opaque
stringData:
  ENDPOINT: "${OBJECTS_ENDPOINT}"
  ACCESS_KEY: "${OBJECTS_ACCESS_KEY}"
  SECRET_KEY: "${OBJECTS_SECRET_KEY}"
  PC_SECRET: "${PC_ENDPOINT}:${PC_PORT}:${PC_USER}:${PC_PASS}"
  S3_INSECURE: "true"
  PC_INSECURE: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: nutanix-object-store-credentials
  namespace: container-object-storage-system
type: Opaque
stringData:
  ENDPOINT: "${OBJECTS_ENDPOINT}"
  ACCESS_KEY: "${OBJECTS_ACCESS_KEY}"
  SECRET_KEY: "${OBJECTS_SECRET_KEY}"
  PC_SECRET: "${PC_ENDPOINT}:${PC_PORT}:${PC_USER}:${PC_PASS}"
  S3_INSECURE: "true"
  PC_INSECURE: "true"
